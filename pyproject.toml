[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-test-orchestrator-lab"
version = "0.1.0"
description = "Synthetic edge to cloud timing test lab"
requires-python = ">=3.11"
dependencies = ["fastapi==0.121.0", "uvicorn==0.38.0", "httpx==0.28.1", "pydantic==2.12.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.3", "gcovr==8.4"]

[project.scripts]
edge-lab = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers"
markers = ["e2e: requires the Docker Compose stack on a GitHub runner"]

[tool.coverage.run]
source = ["orchestrator"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
